<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E07A5F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>To Do</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>✅</text></svg>">
</head>
<body>
  <div class="app">
    <div id="update-banner" class="update-banner">
      New version available — <a href="#" id="update-refresh">Refresh</a>
    </div>

    <header>
      <h1>To Do</h1>
    </header>

    <main>
      <div class="input-row">
        <input type="text" id="task-input" placeholder="Add a task..." maxlength="300" autocomplete="off" aria-label="New task">
      </div>

      <section aria-label="Active tasks">
        <ul id="active-tasks" class="task-list"></ul>
      </section>

      <button id="completed-toggle" class="completed-toggle" hidden aria-expanded="false" aria-controls="completed-tasks">
        <span class="arrow" aria-hidden="true">▸</span>
        Show completed (<span class="count">0</span>)
      </button>

      <section aria-label="Completed tasks">
        <ul id="completed-tasks" class="completed-list task-list" hidden></ul>
      </section>
    </main>

    <footer class="footer">
      <button id="export-btn" class="export-btn" aria-label="Export tasks as JSON">Export JSON</button>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
